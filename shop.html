<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Collections — Taathaal
  </title>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <div data-site-header="">
  </div>
  <main class="container">
   <div class="shop-head">
    <div class="eyebrow">
     The collection
    </div>
    <h1>
     Assamese craft, curated.
    </h1>
    <p>
     Handmade-inspired textiles and contemporary fusion pieces.
    </p>
   </div>
   <div class="shop-tools">
    <div class="search-box">
     <svg aria-hidden="true" viewbox="0 0 24 24">
      <circle cx="11" cy="11" r="6.5">
      </circle>
      <path d="m16 16 5 5">
      </path>
     </svg>
     <input id="shop-search" onkeydown="if(event.key==='Enter')updateShop()" placeholder="Search Mekhela, Gamusa, clutch…" type="search"/>
     <button onclick="updateShop()" type="button">
      Search
     </button>
    </div>
    <div class="sort-wrap">
     <label for="shop-sort">
      Sort by
     </label>
     <select class="select" id="shop-sort" onchange="updateShop()">
      <option value="featured">
       Featured
      </option>
      <option value="rating">
       Top rated
      </option>
      <option value="price-low">
       Price: low to high
      </option>
      <option value="price-high">
       Price: high to low
      </option>
      <option value="name">
       Name: A–Z
      </option>
     </select>
    </div>
   </div>
   <div class="toolbar">
    <div class="filters" id="filters">
    </div>
    <span id="shop-count">
    </span>
   </div>
   <div class="grid" id="shop-grid">
   </div>
  </main>
  <footer class="footer" style="margin-top:80px">
   <div class="container">
    <div class="brand" style="color:white">
     TAATHAAL
    </div>
   </div>
  </footer>
  <script src="js/data.js">
  </script>
  <script src="js/app.js">
  </script>
  <script src="js/admin_features.js">
  </script>
  <script src="js/firebase.js" type="module">
  </script>
 </body>
</html>
