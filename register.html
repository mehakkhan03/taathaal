<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Create account — Taathaal
  </title>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <div data-site-header="">
  </div>
  <main class="auth-page">
   <div class="auth-card">
    <div class="eyebrow">
     Join Taathaal
    </div>
    <h1>
     Create your account.
    </h1>
    <p class="muted">
     Save your profile and keep your order history together.
    </p>
    <form id="register-form">
     <label>
      Name
      <input id="reg-name" placeholder="Your name" required=""/>
     </label>
     <label>
      Email
      <input id="reg-email" placeholder="you@example.com" required="" type="email"/>
     </label>
     <label>
      Password
      <input id="reg-password" placeholder="At least 4 characters" required="" type="password"/>
     </label>
     <button class="btn primary full" type="submit">
      Create account
     </button>
    </form>
    <p>
     Already have an account?
     <a class="text-link" href="login.html">
      Log in
     </a>
    </p>
   </div>
  </main>
  <script src="js/data.js">
  </script>
  <script src="js/app.js">
  </script>
  <script src="js/admin_features.js">
  </script>
  <script src="js/firebase.js" type="module">
  </script>
 </body>
</html>
